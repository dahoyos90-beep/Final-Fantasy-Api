<!--
  [RUTA]    index.html
  [CAPA]    raíz del proyecto (no es src, no es un anillo)
  [HACE]    Es el HTML base que Vite sirve; contiene el div#root
            donde React monta la app y define idioma y título
  [LO USAN] Vite (dev server y build) y el navegador
  [VERSIÓN] 1.0.0 · 2026-10-14 · versión inicial
-->

<!doctype html>
<html lang="es"> <!-- [HACE] declara el idioma de la página en español -->
  <head>
    <meta charset="UTF-8" /> <!-- [HACE] permite tildes y eñes sin romperse -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- [HACE] icono de la pestaña (lo trae Vite) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- [HACE] adapta la vista a celular -->
    <title>Final Fantasy VII</title> <!-- [HACE] título que se ve en la pestaña del navegador -->
  </head>
  <body>
    <div id="root"></div> <!-- [HACE] aquí React monta toda la app -->
    <script type="module" src="/src/main.jsx"></script> <!-- [HACE] carga el punto de entrada de React -->
  </body>
</html>
